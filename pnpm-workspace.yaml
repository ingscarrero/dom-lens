# pnpm settings (pnpm >= 10 reads these here, not from package.json#pnpm).
# No workspace packages are declared: examples/mf-demo is its own workspace.
# Build scripts are opt-in for supply-chain hygiene; esbuild needs its
# postinstall to place the platform binary, spawn-sync does not.
allowBuilds:
  esbuild: true
  spawn-sync: false

# Supply-chain release-age policy. pnpm 11 enforces a 24 h minimum age by
# default and verifies the lockfile against it on every install; it is
# stated here so the exemption below is read against an explicit rule.
minimumReleaseAge: 1440
# adm-zip 0.6.1 (published 2026-09-11) is the only release that closes
# GHSA-vwc7-r8mq-g2x9 and was under 24 h old when the override was pinned.
# Safe to delete this exemption after 2026-09-12.
minimumReleaseAgeExclude:
  - adm-zip@0.6.1

# Dev-only transitive advisories whose dependents pin a vulnerable version
# (all sit under wxt > web-ext-run, the Firefox dev runner, or the build
# toolchain; none ship in the extension bundle). Revisit when wxt bumps
# web-ext-run / esbuild and drop the override that is no longer needed.
overrides:
  adm-zip: ^0.6.1 # GHSA-xcpc-8h2w-3j85, GHSA-vwc7-r8mq-g2x9
  shell-quote: ^1.10.0 # GHSA-w7jw-789q-3m8p, GHSA-395f-4hp3-45gv
  tmp: ^0.2.6 # GHSA-ph9p-34f9-6g65
  node-notifier>uuid: ^11.1.1 # GHSA-w5hq-g745-h8pq
  esbuild: ^0.28.1 # GHSA-g7r4-m6w7-qqqr
